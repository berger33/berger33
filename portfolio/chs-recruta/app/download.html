<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baixar CHS Recruta Portátil</title><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:620px;padding:32px;border:1px solid #30363d;border-radius:12px;background:#161b22}button{padding:12px 18px;border:0;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><main class="card"><h1>CHS Recruta Portátil</h1><p>Gerando a edição de demonstração sanitizada em um único arquivo HTML...</p><button id="download">Baixar novamente</button><p id="status"></p></main><script>async function build(){const status=document.getElementById('status');status.textContent='Preparando download...';try{const base=new URL('.',location.href);const [p1,p2]=await Promise.all([fetch(new URL('payload-1.txt',base)).then(r=>r.text()),fetch(new URL('payload-2.txt',base)).then(r=>r.text())]);const bytes=Uint8Array.from(atob((p1+p2).trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='CHS-Recruta-Portatil-Demo.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);status.innerHTML='Download pronto. Abra <b>CHS-Recruta-Portatil-Demo.html</b> no navegador e use <b>demo / demo123</b>.';}catch(e){status.textContent='Não foi possível gerar o arquivo neste navegador. Use Chrome, Edge ou Firefox atualizado.';console.error(e)}}document.getElementById('download').addEventListener('click',build);build();</script></body></html>
