<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHS Recruta Portátil — Demo</title></head><body><p style="font-family:system-ui;padding:24px">Carregando CHS Recruta Portátil...</p><script>(async()=>{const root='https://raw.githubusercontent.com/berger33/berger33/main/portfolio/chs-recruta/app/';const [p1,p2]=await Promise.all([fetch(root+'payload-1.txt').then(r=>r.text()),fetch(root+'payload-2.txt').then(r=>r.text())]);const b=(p1+p2).trim();const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();})().catch(e=>{document.body.innerHTML='<main style="font-family:system-ui;max-width:720px;margin:60px auto;padding:24px"><h1>CHS Recruta Portátil</h1><p>Não foi possível carregar a demo automaticamente neste navegador.</p><p>Use Chrome, Edge ou Firefox atualizado, ou baixe a versão portátil pelo README do projeto.</p></main>';console.error(e)});</script></body></html>
