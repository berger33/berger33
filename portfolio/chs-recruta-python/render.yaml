services:
  - type: web
    name: chs-recruta
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chs-recruta-db
          property: connectionString
      - key: SESSION_TTL_HOURS
        value: "12"

databases:
  - name: chs-recruta-db
    databaseName: chs_recruta
    user: chs_recruta
