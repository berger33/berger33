name: CHS Recruta Python

on:
  push:
    paths:
      - "portfolio/chs-recruta-python/**"
      - ".github/workflows/chs-recruta-python.yml"
  pull_request:
    paths:
      - "portfolio/chs-recruta-python/**"
      - ".github/workflows/chs-recruta-python.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/chs-recruta-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio/chs-recruta-python/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q
      - name: Validate Compose
        run: docker compose config --quiet
