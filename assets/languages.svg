<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Linguagens utilizadas no GitHub</title>
  <desc id="desc">Painel local de linguagens, atualizado automaticamente pelo GitHub Actions.</desc>
  <rect x="1" y="1" width="718" height="298" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="34" y="52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f0f6fc">Linguagens utilizadas no GitHub</text>
  <text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8b949e">Painel automático · repositórios públicos autorais · forks excluídos</text>
  <rect x="34" y="112" width="652" height="120" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="360" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#58a6ff">Sincronizando dados do GitHub…</text>
  <text x="360" y="191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8b949e">O GitHub Actions substituirá este painel pelos percentuais reais.</text>
  <text x="34" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6e7681">Fonte: GitHub Linguist / API de linguagens dos repositórios</text>
</svg>
